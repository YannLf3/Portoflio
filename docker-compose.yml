version: '3.8'

services:
  # Service Base de données MySQL
  db:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio_db
    ports:
      - "3306:3306"
    volumes:
      # Exécute automatiquement schema.sql au tout premier démarrage
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      # Persistance des données (pour ne pas perdre tes données quand tu coupes Docker)
      - db_data:/var/lib/mysql

  # Interface graphique Web pour la BDD (Optionnel mais très pratique)
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio_phpmyadmin
    restart: always
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root

volumes:
  db_data: