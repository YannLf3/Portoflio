version: '3.8'

services:
  web:
    build: .
    container_name: portfolio_app
    restart: always
    ports:
      - "127.0.0.1:8000:80"
    environment:
      # Active le mode développement (cookie de session non Secure en http://localhost) — lu par public/index.php
      ENVIRONMENT: dev
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: portfolio_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./database/seed-dev.sql:/docker-entrypoint-initdb.d/zz-seed-dev.sql
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: portfolio_phpmyadmin
    platform: linux/amd64
    restart: always
    ports:
      - "127.0.0.1:8080:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root
      PMA_ABSOLUTE_URI: http://localhost:8080/
      PMA_ARBITRARY: 1

volumes:
  db_data: